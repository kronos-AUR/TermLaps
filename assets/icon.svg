<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- TermLaps icon — GNOME Terminal 2019 layout, Flexoki palette (https://stephango.com/flexoki) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#282726"/>
      <stop offset="1" stop-color="#100F0F"/>
    </linearGradient>
  </defs>
  <rect x="48" y="48" width="416" height="416" rx="30" fill="url(#bg)" stroke="#403E3C" stroke-width="2"/>
  <!-- prompt chevron: flexoki green 400 -->
  <polygon points="112,117 168,156 112,195 112,174 146,156 112,138" fill="#879A39"/>
  <!-- cursor underscore: flexoki blue 400 -->
  <rect x="184" y="209" width="64" height="14" fill="#4385BE"/>
</svg>
