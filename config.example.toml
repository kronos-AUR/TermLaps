# TermLaps configuration example.
# Copy this file to ~/.config/termlaps/config.toml (a default one is written
# there automatically on first start).

[settings]
# Default font (can be overridden per profile).
font = "Monospace 12"
# Number of scrollback lines kept per terminal.
scrollback_lines = 10000
# Color theme for the WHOLE app (all tabs and splits).
# Can also be changed at runtime from the Settings page (Ctrl+,) —
# the choice is saved back here and persists across restarts.
# Values: flexoki | monokai | solarized-light | solarized-dark
theme = "flexoki"

# ---------------------------------------------------------------------------
# Profiles: each profile is a possible new tab, with its command.
# `command` accepts a string ("/bin/bash") or a list
# (["/usr/bin/env", "zsh", "-l"]): the first entry is the executable.
# ---------------------------------------------------------------------------

[[profiles]]
name = "Bash"
command = "/bin/bash"

